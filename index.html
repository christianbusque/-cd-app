<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Planification — CD Repère</title>
<style>
:root{
  --fond:#0E1113; --panneau:#181C1F; --creux:#101315; --bord:#282D31;
  --texte:#EDEBE6; --sourd:#7C8285; --jaune:#F2A800; --vert:#4CB94C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--fond);color:var(--texte);font:400 16px/1.4 system-ui,-apple-system,sans-serif;
  padding:16px;padding-bottom:40px}
h1{font-size:18px;font-weight:500;color:#E3C46A;margin-bottom:4px}
.sous{color:var(--sourd);font-size:13px;margin-bottom:16px}
input,select{width:100%;background:var(--creux);border:2px solid var(--bord);border-radius:8px;
  color:var(--texte);font-size:16px;padding:12px;outline:none;margin-bottom:10px}
input:focus,select:focus{border-color:var(--jaune)}
button{width:100%;font:500 16px system-ui;color:var(--texte);background:var(--creux);
  border:2px solid var(--bord);border-radius:8px;padding:14px;margin-bottom:8px}
button.accent{border-color:var(--jaune);color:var(--jaune)}
button.vert{border-color:var(--vert);color:var(--vert)}
.carte{background:var(--creux);border:1px solid var(--bord);border-radius:8px;padding:14px;
  margin-bottom:8px;cursor:pointer}
.carte .local{font-weight:600;font-size:15px}
.carte .projet{color:var(--sourd);font-size:12px;margin-bottom:6px}
.carte .plan{font-size:13px}
.carte .plan.vide{color:var(--sourd);font-style:italic}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:6px}
.badge.entrepot{background:#2a4a7a;color:#a8c8f5}
.badge.chantier{background:#4a6a2a;color:#c8e5a8}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:30;
  align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.overlay .boite{background:var(--panneau);border-radius:10px;padding:20px;max-width:420px;width:100%;
  max-height:85vh;overflow-y:auto}
.overlay h3{margin-bottom:4px;font-size:17px}
.overlay .sous{margin-bottom:14px}
.duo{display:flex;gap:8px;margin-bottom:10px}
.duo button{flex:1;margin-bottom:0}
.duo button.actif{border-color:var(--jaune);color:var(--jaune);background:#2a2410}
.hidden{display:none !important}
.msg{padding:12px;border-radius:8px;background:var(--creux);border-left:4px solid var(--bord);
  margin-bottom:12px;font-size:14px}
.msg.err{border-left-color:#D93A3A;color:#f5a3a3}
.msg.ok{border-left-color:var(--vert);color:#a8e6a8}
</style>
</head>
<body>

<div id="ecran-code">
  <h1>Planification des livraisons</h1>
  <div class="sous">CD Repère — Cuisi-Design AB</div>
  <div id="msg-code"></div>
  <input id="code-employe" placeholder="Code d'accès (10 caractères)" autocapitalize="characters">
  <button class="accent" id="btn-entrer">Entrer</button>
</div>

<div id="ecran-liste" class="hidden">
  <h1>Planification</h1>
  <div class="sous" id="sous-bienvenue"></div>
  <input id="recherche" placeholder="Chercher un WO, un local, un projet…">
  <div id="msg-liste"></div>
  <div id="liste"></div>
</div>

<div class="overlay" id="overlay-edit">
  <div class="boite">
    <h3 id="ed-local">—</h3>
    <div class="sous" id="ed-projet">—</div>
    <div class="duo">
      <button id="ed-entrepot">Entrepôt</button>
      <button id="ed-chantier">Chantier</button>
    </div>
    <input id="ed-detail" placeholder="Détail (ex. St-Benoît, ou adresse du client)">
    <input id="ed-date" type="date">
    <button class="vert" id="ed-sauver">Sauvegarder</button>
    <button id="ed-annuler">Annuler</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xgjlsddlbhmvkwyiwmqc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_jdJMKiYpc_01gpmRgc17iA_yLOMqJ1D";

const $ = id => document.getElementById(id);
let codeEmploye = sessionStorage.getItem('plan_code') || '';
let woEnEdition = null;
let destChoisie = null;

async function rpc(nom, args){
  const rep = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + nom, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY,
               "Authorization": "Bearer " + SUPABASE_ANON_KEY },
    body: JSON.stringify(args),
  });
  const texte = await rep.text();
  let data; try{ data = JSON.parse(texte); }catch(e){ data = texte; }
  if (!rep.ok) throw new Error((data && data.message) ? data.message : String(data));
  return data;
}

function msg(id, texte, type){
  $(id).innerHTML = texte ? '<div class="msg ' + (type||'') + '">' + texte + '</div>' : '';
}

$('btn-entrer').onclick = async () => {
  const c = $('code-employe').value.trim();
  if (!c){ msg('msg-code', 'Entre ton code.', 'err'); return; }
  try{
    await rpc('planification_lister', { p_code: c });
    codeEmploye = c;
    sessionStorage.setItem('plan_code', c);
    $('ecran-code').classList.add('hidden');
    $('ecran-liste').classList.remove('hidden');
    chargerListe();
  }catch(e){
    msg('msg-code', 'Erreur : ' + e.message, 'err');
  }
};
$('code-employe').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-entrer').click(); });

let listeActuelle = [];
async function chargerListe(){
  const recherche = $('recherche').value.trim();
  try{
    listeActuelle = await rpc('planification_lister', {
      p_code: codeEmploye, p_recherche: recherche || null });
    dessinerListe();
  }catch(e){
    msg('msg-liste', 'Erreur : ' + e.message, 'err');
  }
}
$('recherche').addEventListener('input', () => {
  clearTimeout(window._rt);
  window._rt = setTimeout(chargerListe, 300);
});

function dessinerListe(){
  if (!listeActuelle.length){
    $('liste').innerHTML = '<div class="sous">Aucun work order actif trouvé.</div>';
    return;
  }
  $('liste').innerHTML = listeActuelle.map((wo, i) => {
    let plan;
    if (wo.destination_type){
      plan = '<span class="badge ' + wo.destination_type + '">' +
        (wo.destination_type === 'entrepot' ? 'Entrepôt' : 'Chantier') + '</span>' +
        (wo.destination_detail || '') + (wo.date_prevue ? '  ·  ' + wo.date_prevue : '');
    } else {
      plan = 'Pas encore planifié';
    }
    return '<div class="carte" data-i="' + i + '">' +
      '<div class="local">' + (wo.nom_local || wo.microvellum_wo || '—') + '</div>' +
      '<div class="projet">' + (wo.microvellum_wo || '') + '  ·  ' + (wo.nom_projet || '') + '</div>' +
      '<div class="plan' + (wo.destination_type ? '' : ' vide') + '">' + plan + '</div>' +
      '</div>';
  }).join('');
  document.querySelectorAll('.carte').forEach(el => {
    el.onclick = () => ouvrirEdition(listeActuelle[parseInt(el.dataset.i)]);
  });
}

function ouvrirEdition(wo){
  woEnEdition = wo;
  destChoisie = wo.destination_type || null;
  $('ed-local').textContent = wo.nom_local || wo.microvellum_wo || '—';
  $('ed-projet').textContent = (wo.microvellum_wo || '') + '  ·  ' + (wo.nom_projet || '');
  $('ed-detail').value = wo.destination_detail || '';
  $('ed-date').value = wo.date_prevue || '';
  majBoutonsDestination();
  $('overlay-edit').classList.add('on');
}
function majBoutonsDestination(){
  $('ed-entrepot').classList.toggle('actif', destChoisie === 'entrepot');
  $('ed-chantier').classList.toggle('actif', destChoisie === 'chantier');
}
$('ed-entrepot').onclick = () => { destChoisie = 'entrepot'; majBoutonsDestination(); };
$('ed-chantier').onclick = () => { destChoisie = 'chantier'; majBoutonsDestination(); };
$('ed-annuler').onclick = () => $('overlay-edit').classList.remove('on');

$('ed-sauver').onclick = async () => {
  if (!destChoisie){ alert('Choisis Entrepôt ou Chantier.'); return; }
  const detail = $('ed-detail').value.trim();
  const date = $('ed-date').value;
  if (!detail){ alert('Le détail (ville ou adresse) est requis.'); return; }
  if (!date){ alert('La date est requise.'); return; }
  try{
    await rpc('planification_definir', {
      p_code: codeEmploye, p_wo_id: woEnEdition.id,
      p_destination_type: destChoisie, p_destination_detail: detail, p_date_prevue: date });
    $('overlay-edit').classList.remove('on');
    msg('msg-liste', 'Planification sauvegardée.', 'ok');
    chargerListe();
  }catch(e){
    alert('Erreur : ' + e.message);
  }
};

if (codeEmploye){
  $('ecran-code').classList.add('hidden');
  $('ecran-liste').classList.remove('hidden');
  chargerListe();
}
</script>
</body>
</html>
